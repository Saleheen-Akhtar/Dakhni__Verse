    <circle cx="256" cy="270" r="80" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="4 4"/>
  </g>

  <!-- DV Monogram -->
  <!-- Letter 'D' -->
  <path d="M120 160 H210 C258 160 286 188 286 236 V284 C286 332 258 360 210 360 H120 V160 Z M168 206 V314 H204 C230 314 242 298 242 272 V248 C242 222 230 206 204 206 H168 Z" fill="#FFFFFF"/>
  
  <!-- Letter 'V' in signature Crimson Red with overlap shadow -->
