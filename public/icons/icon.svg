    <stop offset="0%" stop-color="#222222"/>
    <stop offset="100%" stop-color="#0A0A0A"/>
  </radialGradient>
  <rect width="512" height="512" rx="104" fill="url(#bgGlow)"/>

  <!-- Red Accent Bar (Dakhni Verse brand signature) -->
